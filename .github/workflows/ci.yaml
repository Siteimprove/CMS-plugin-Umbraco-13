name: Umbraco 17 validation
on:
  push:
    branches: [master, main, "port/umbraco-17"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: JavaScript regression tests
        run: npm test
      - name: Backend and preview regression tests
        run: dotnet test tests/Siteimprove.Umbraco17.Plugin.Tests.csproj -c Release
      - name: Pack
        run: dotnet pack Siteimprove.Umbraco17.Plugin.csproj -c Release -o artifacts
      - name: Verify NuGet installation and published assets
        run: bash scripts/verify-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Siteimprove-Umbraco17-preview
          path: artifacts/*.nupkg
# Publishing is a separate release action after Cloud/on-premises acceptance.

