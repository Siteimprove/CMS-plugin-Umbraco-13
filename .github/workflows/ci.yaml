name: Umbraco 17 validation
on:
  push:
    branches: [master, main, "port/umbraco-17"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: JavaScript regression tests
        run: npm test
      - name: Backend and preview regression tests
        run: dotnet test tests/Siteimprove.Umbraco17.Plugin.Tests.csproj -c Release
      - name: Pack
        run: dotnet pack Siteimprove.Umbraco17.Plugin.csproj -c Release -o artifacts
      - name: Verify NuGet installation and published assets
        run: bash scripts/verify-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Siteimprove-Umbraco17-preview
          path: artifacts/*.nupkg
      - name: Prepare real Umbraco browser-test host and Chromium
        run: bash scripts/prepare-browser-tests.sh
      - name: Playwright functional tests
        run: |
          export E2E_ADMIN_PASSWORD="$(node -e "process.stdout.write('E2e!' + require('node:crypto').randomBytes(24).toString('hex'))")"
          npm --prefix tests/browser test
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Siteimprove-Playwright-evidence
          path: |
            tests/browser/test-results/
            tests/browser/playwright-report/
# Publishing is a separate release action after Cloud/on-premises acceptance.

